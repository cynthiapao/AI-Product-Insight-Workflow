name: Generate AI product insight draft

on:
  schedule:
    # Every Monday at 09:20 China Standard Time.
    - cron: "20 9 * * 1"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      product_name:
        description: "Optional product name; leave empty for automatic discovery"
        required: false
        type: string
      product_url:
        description: "Product URL; required when product_name is set"
        required: false
        type: string
      notes:
        description: "Optional personal notes or observation"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: insight-draft
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual input
        if: ${{ inputs.product_name != '' && inputs.product_url == '' }}
        run: |
          echo "product_url is required when product_name is provided" >&2
          exit 2

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install workflow
        run: python -m pip install -e .

      - name: Generate scheduled draft
        if: ${{ inputs.product_name == '' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m ai_product_insight scheduled

      - name: Generate requested product draft
        if: ${{ inputs.product_name != '' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: >-
          python -m ai_product_insight manual
          --name "${{ inputs.product_name }}"
          --url "${{ inputs.product_url }}"
          --notes "${{ inputs.notes }}"

      - name: Upload review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insight-draft-${{ github.run_id }}
          path: |
            output/drafts/
            output/social/
            inputs/assets/
            data/runs/
          if-no-files-found: error

      - name: Create draft branch
        id: draft_branch
        run: |
          branch="insight-draft/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -f output/drafts output/social inputs/assets data/runs
          git commit -m "content: add article and social drafts"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open draft pull request for human review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body_file="$(find output/social -name pr-body.md -print -quit)"
          if [ -n "$body_file" ]; then
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "${{ steps.draft_branch.outputs.branch }}" \
              --draft \
              --title "AI 产品洞察与社交内容草稿：等待人工审核" \
              --body-file "$body_file"
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "${{ steps.draft_branch.outputs.branch }}" \
              --draft \
              --title "AI 产品洞察草稿：等待人工审核" \
              --body "文章已经生成，但社交内容生成失败。请检查运行报告后再合并。"
          fi
